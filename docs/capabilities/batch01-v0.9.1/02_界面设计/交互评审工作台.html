// 本脚本只管理评审示意状态，不读取或写入真实工程，不发起网络请求。
const caps=JSON.parse(document.getElementById('review-data').textContent);
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function key(){return (app.index>=8?'catalog':'project:S'+app.setup)+':'+caps[app.index].id;}

function sample(field,i){const k=field[1];const d={'displayName':'演示工程 / 仅作交互评审','projectId':'demo-project','generation':'4 · 示例检查点','workflowMode':app.mode==='explore'?'A · 探索':'B · 生产草稿','scope':'当前示意范围','theme':app.theme,'revisionId':'r1（合成修订）','lifecycle':app.scenario==='readOnly'?'Released · 只读示意':'Draft · 未验证','cuttingDiameter':'10 mm · 公式示例，非推荐','cuttingLength/overallLength/shankDiameter':'20 / 70 / 10 mm · 示例','effectiveTeeth':'4 · 公式示例','cuttingSpeed/feedPerTooth':'100 m/min / 0.05 mm/tooth · 示例','backendState':'未接真实后端','moduleId':'procet.resources · 示例','uiVersion':'0.9.1-review','producerPin':'固定基线示意；查看完整文档','assuranceLevel':'本机声明 · 未经组织认证','runState':'succeeded · 示例','adoptionState':'conflict · 尚未采纳','cutterKind':'flatEndMill · 示例','axisDirection':'[0, 0, 1] · 父局部Frame','displayName/code':'示意资源 / DEMO-01','hostJobId':'demo-host-job-01'};return d[k]??(i%3===0?'待选对象 · 示意':i%3===1?'精确引用 / 由权威模块提供':'在正式接线后读取');}

function renderPanel(){const c=caps[app.index],m=model();$('capId').textContent=c.id+' / REVIEW';$('capName').textContent=c.name;$('revChip').textContent='演示 r'+rev();$('stateChip').textContent=m.dirty?'未提交草稿':stateNames[app.scenario];

if(!isResource)body+='<div class="scope-controls"><button data-setup="1">Setup01</button><button data-setup="2">Setup02</button></div>';

body+='</div><div class="rule">'+esc(c.goal)+'</div><div class="section-title">字段与权威来源 · 演示输入</div>';

function render(){const c=caps[app.index];$('capSelect').value=app.index;$('count').textContent=(app.index+1)+' / 10';$('prev').disabled=app.index===0;$('next').disabled=app.index===9;$('scenario').value=app.scenario;$('modeLabel').textContent='业务模式 '+(app.mode==='explore'?'A · 探索':'B · 生产草稿');$('storyText').textContent=c.flow[0];$('storyTitle').textContent='业务主线 · '+c.name;$('sceneTitle').textContent=app.index===8?'资源空间 · 合成机床构型':app.index===9?'资源空间 · 合成刀具几何':'工程空间 · 演示部件';$('spaceTag').textContent=app.index>=8?'RESOURCE SPACE / ONE ACTIVE WORLD':'PROJECT SPACE / ONE ACTIVE WORLD';$('scopeStatus').textContent=app.index>=8?'资源目录 / '+c.name:'演示工程 / 文档01 / Setup0'+app.setup;$('selectionStatus').textContent=app.picked?'已选：'+app.picked:'未选择';$('picked').textContent=app.picked?'语义选中：'+app.picked+'（示意）':'点击示意对象可定位参数区域';document.body.classList.toggle('focus-mode',app.focus);document.querySelectorAll('[data-cap]').forEach(b=>b.classList.toggle('active',+b.dataset.cap===app.index));$('focus').textContent=app.focus?'返回':'专注';renderPanel();requestAnimationFrame(draw);}
function navigate(i){if(i<0||i>=caps.length)return;app.index=i;app.epoch++;app.picked=null;app.focus=false;render();$('panelBody').scrollTop=0;}

function showSpec(){const c=caps[app.index];openModal(c.id+' · '+c.name,'<p>'+esc(c.goal)+'</p><h3>业务主流程</h3><ol>'+c.flow.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><h3>页面与操作边界</h3><table><thead><tr><th>状态/页面</th><th>内容</th><th>动作</th></tr></thead><tbody>'+c.screens.map(s=>'<tr><td>'+esc(s[0])+'</td><td>'+esc(s[1])+'</td><td>'+esc(s[2])+'</td></tr>').join('')+'</tbody></table><h3>命令接线（逻辑名，非已实现API）</h3><table><thead><tr><th>命令</th><th>输入</th><th>回执与拒绝</th></tr></thead><tbody>'+c.commands.map(s=>'<tr><td>'+esc(s[0])+'</td><td>'+esc(s[1])+'</td><td>'+esc(s[2])+'<br>'+esc(s[3])+'</td></tr>').join('')+'</tbody></table><h3>验收场景（未执行产品测试）</h3><ol>'+c.tests.map(t=>'<li><strong>'+esc(t.title)+'</strong>：'+esc(t.given)+'；'+esc(t.when)+' → '+esc(t.then)+'</li>').join('')+'</ol><h3>扩展边界</h3><p>'+esc(c.extension)+'</p><p><a href="'+encodeURI(c.file)+'">打开随包完整Markdown规格</a></p>');}
function selectResource(){if(app.index>=8){log('资源目录可独立维护；请从工程任务发起选择返回演示。');return;}app.returnContext={index:app.index,setup:app.setup,epoch:app.epoch,revision:rev()};navigate(8);log('示意：已保存发起范围和返回任务，切换到同一个空间的资源会话。');}
function returnResource(commit){const origin=app.returnContext;if(!origin)return;if(commit&&app.scenario==='conflict'){log('演示CAS冲突：发起范围已过期，不能写入当前其他Setup。',true);return;}app.returnContext=null;app.setup=origin.setup;navigate(origin.index);log(commit?'演示回执：已向原Setup绑定资源R1并恢复现场。未调用真实后端。':'示意：已取消资源选择，原任务与草稿不变。');}
function commit(){if($('commit').disabled)return;if(app.scenario==='conflict'){if(app.returnContext){returnResource(true);return;}log('演示冲突：expectedRevision已过期，草稿保留；未写真实工程。',true);return;}if(app.returnContext&&app.index>=8){returnResource(true);return;}if(app.index===3){openModal('审批预检 · 只做示意','<p>目标：演示r'+rev()+'。身份等级：本机声明。</p><p>本包没有可信身份、签章或真实验证证据。这里只演示“先明确目标、再看证据、最后执行授权命令”的界面顺序，不会生成真实批准记录。</p>');return;}if(app.index===4){openModal('A → B 接管预览 · 示意','<p>继承：当前工程ExactRef、选定候选与冻结范围。</p><p>待补：工艺Setup、机床执行配置及后续程序验证。接管不会自动批准。</p><div class="dialog-actions"><button id="cancelHandoff">取消</button><button id="confirmHandoff" class="primary">确认示意接管</button></div>');$('cancelHandoff').onclick=closeModal;$('confirmHandoff').onclick=()=>{app.mode='production';app.revisions[key()]=rev()+1;model().dirty=false;closeModal();render();log('演示回执：进入B生产草稿，审批与NC资格仍未验证。');};return;}
model().dirty=false;app.revisions[key()]=rev()+1;render();log('演示回执：已更新本页内存修订。未保存任何真实工程或资源。');}
function discard(){const m=model();m.values={};m.dirty=false;render();log('示意：当前范围的编辑已放弃，其他Setup草稿保留。');}
function draw(){const cvs=$('scene'),ctx=cvs.getContext('2d');if(!ctx)return;const rect=cvs.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);cvs.width=Math.round(rect.width*dpr);cvs.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);hitzones=[];const styles=getComputedStyle(document.documentElement),text=styles.getPropertyValue('--text').trim(),accent=styles.getPropertyValue('--accent').trim(),line=styles.getPropertyValue('--line').trim(),muted=styles.getPropertyValue('--muted').trim();const safeLeft=app.focus?90:(innerWidth<930?432:492),cx=safeLeft+(rect.width-safeLeft)*.47,cy=Math.max(300,Math.min(rect.height*.47,460));const scale=Math.max(.5,Math.min(1.08,(rect.width-safeLeft)/620));
function p(x,y,z){return [cx+(x-y)*.83*scale,cy+(x+y)*.36*scale-z*scale];}
function box(x,y,z,w,d,h,stroke=accent,alpha=.8){const pts=[[x,y,z],[x+w,y,z],[x+w,y+d,z],[x,y+d,z],[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]].map(a=>p(...a));ctx.save();ctx.strokeStyle=stroke;ctx.globalAlpha=alpha;ctx.lineWidth=1.5;ctx.fillStyle=accent;ctx.globalAlpha=.045;ctx.beginPath();[4,5,6,7].forEach((q,j)=>j?ctx.lineTo(...pts[q]):ctx.moveTo(...pts[q]));ctx.closePath();ctx.fill();ctx.globalAlpha=alpha;[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(e=>{ctx.beginPath();ctx.moveTo(...pts[e[0]]);ctx.lineTo(...pts[e[1]]);ctx.stroke();});ctx.restore();return pts;}
function label(name,xyz,fieldIndex,dx=11,dy=4){const pt=p(...xyz);ctx.save();ctx.strokeStyle=line;ctx.fillStyle=text;ctx.lineWidth=1;ctx.beginPath();ctx.arc(pt[0],pt[1],4,0,Math.PI*2);ctx.stroke();if(Math.abs(dx)>20||Math.abs(dy)>20){ctx.beginPath();ctx.moveTo(pt[0]+5,pt[1]);ctx.lineTo(pt[0]+dx-7,pt[1]+dy-4);ctx.stroke();}ctx.font='12px system-ui';ctx.fillText(name,pt[0]+dx,pt[1]+dy);ctx.restore();hitzones.push({x:pt[0],y:pt[1],w:145,h:28,name,fieldIndex});}

if(app.index===8){box(-165,-70,-50,310,155,36,muted,.45);box(-118,5,-14,80,70,240,accent,.6);box(-95,-13,155,220,55,60);box(65,-8,80,45,45,76);box(-60,-80,-14,180,150,24);box(-25,-50,10,80,70,28,muted,.6);ctx.save();ctx.strokeStyle=muted;ctx.setLineDash([5,6]);box(-100,-90,8,235,190,160,muted,.35);ctx.restore();label('主轴安装接口',[94,16,83],5,80,-44);label('线性轴 / 父局部方向',[-100,35,212],2);label('工作台承载端',[16,-44,40],1,100,54);}
else if(app.index===9){const center=p(0,0,0),radius=31*scale,h=230*scale;ctx.save();ctx.strokeStyle=accent;ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(center[0],center[1]-h/2,radius,radius*.35,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(center[0],center[1]+h/2,radius,radius*.35,0,0,Math.PI*2);ctx.stroke();[-1,1].forEach(s=>{ctx.beginPath();ctx.moveTo(center[0]+s*radius,center[1]-h/2);ctx.lineTo(center[0]+s*radius,center[1]+h/2);ctx.stroke();});for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(center[0]-radius+i*radius*.53,center[1]+h*.05);ctx.bezierCurveTo(center[0]-radius+i*radius*.7,center[1]+h*.22,center[0]+radius*.5,center[1]+h*.37,center[0]+radius*.5,center[1]+h*.49);ctx.stroke();}ctx.restore();label('柄部 · 不等于安装刀长',[48,-10,90],2);label('切削直径 · 参数示意',[45,-6,-77],1);label('有效齿数与切削条件',[-114,10,-45],3);}
else{box(-145,-88,0,290,176,36);box(-117,-61,36,106,123,-23,muted,.7);box(18,-61,36,98,123,-23,muted,.7);box(-112,-57,36,34,27,0,accent,.9);label('设计对象 / ExactRef',[-140,-89,44],1);label('工序关联 / 只读投影',[120,25,38],2);label('当前Setup与坐标范围',[-32,114,0],0);}
const origin=p(-170,150,-60);ctx.save();ctx.font='11px system-ui';ctx.strokeStyle=accent;ctx.fillStyle=muted;[[57,19,'X'],[-36,17,'Y'],[0,-54,'Z']].forEach(([x,y,s])=>{ctx.beginPath();ctx.moveTo(...origin);ctx.lineTo(origin[0]+x,origin[1]+y);ctx.stroke();ctx.fillText(s,origin[0]+x+4,origin[1]+y);});ctx.fillText('空间与参数交互示意 · 非真实几何',origin[0]-10,origin[1]+53);ctx.restore();}
function pickAt(x,y){const h=hitzones.find(t=>x>=t.x-9&&x<=t.x+t.w&&Math.abs(y-t.y)<=t.h/2);if(!h)return;app.picked=h.name;$('selectionStatus').textContent='已选：'+h.name;$('picked').textContent='语义选中：'+h.name+'（示意）';document.querySelectorAll('.field.selected').forEach(e=>e.classList.remove('selected'));const f=$('field-'+h.fieldIndex);if(f){f.classList.add('selected');const d=f.closest('details');if(d)d.open=true;f.scrollIntoView({block:'nearest'});}log('示意选择：'+h.name+'。仅定位字段，不修改业务值。');}
$('scene').addEventListener('click',e=>{const b=$('scene').getBoundingClientRect();pickAt(e.clientX-b.left,e.clientY-b.top);});$('scene').addEventListener('keydown',e=>{if(e.key==='Enter'&&hitzones.length){e.preventDefault();pickAt(hitzones[0].x,hitzones[0].y);}});

$('logsBtn').onclick=()=>openModal('消息与演示回执','<p>以下只记录本页面内存中的评审操作，不是产品Journal。</p><ol>'+app.logs.map(l=>'<li>'+esc(l.text)+'</li>').join('')+'</ol>');$('taskCount').onclick=()=>{navigate(5);log('评审原型没有真实运行任务，任务计数保持0。');};$('overview').onclick=()=>openModal('第01批 · 如何评审这10项业务功能','<p><strong>这不是Procet产品演示包，而是需求与界面评审原型。</strong>所有数值、资源、修订与回执均为示意；没有真实后端、Babylon、NC解释或工程文件读写。</p><p>从上方选择十项功能，查看同一左侧任务容器中的字段、操作及权属。右上可切换正常、只读、不可用、冲突和缺失条件。可修改演示字段、切Setup保留草稿、预览A→B接管、从工程选择资源并返回。</p><p>点击空间示意标记可定位字段；这只证明交互概念，不证明真实拓扑拾取或运动正确。浅深主题和专注空间只是布局状态，不改变制造数据。</p><p>“查看完整业务规格”展示流程、命令、边界与未执行的验收场景，并链接本地Markdown文件。</p><h3>范围</h3><p>10项功能、60项L4、80条产品验收规格、30条原工作包映射切口。工作包完整深化另批交付。当前原型通过的检查只列在包内评审测试报告中。</p>');
